name: Generate enterprise migration filename
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Generate migration with pinned Supabase CLI
        run: |
          set -euo pipefail
          npx --yes supabase@2.120.0 migration new enterprise_identity_privacy_integrations
          file="$(find supabase/migrations -maxdepth 1 -type f -name '*_enterprise_identity_privacy_integrations.sql' | sort | tail -n 1)"
          test -n "$file"
          echo "GENERATED_MIGRATION=$file"
          printf '%s\n' "$file" > generated-migration-path.txt
      - name: Upload generated migration
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: generated-enterprise-migration
          path: |
            generated-migration-path.txt
            supabase/migrations/*_enterprise_identity_privacy_integrations.sql
          if-no-files-found: error
