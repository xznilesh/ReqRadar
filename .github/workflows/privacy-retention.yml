name: XZRecruiter privacy retention

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Retention mode
        required: true
        type: choice
        options:
          - dry_run
          - execute
        default: dry_run
      limit:
        description: Maximum candidates
        required: false
        default: "100"
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: read

jobs:
  retention:
    if: github.event_name == 'workflow_dispatch' || vars.XZRECRUITER_RETENTION_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Deterministic install
        run: npm ci --no-audit --no-fund
      - name: Execute retention policy
        env:
          XZRECRUITER_SUPABASE_URL: ${{ secrets.XZRECRUITER_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          XZRECRUITER_STORAGE_BUCKET: ${{ vars.XZRECRUITER_STORAGE_BUCKET }}
          XZRECRUITER_SENSITIVE_STORAGE_BUCKET: ${{ vars.XZRECRUITER_SENSITIVE_STORAGE_BUCKET }}
          RETENTION_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || vars.XZRECRUITER_RETENTION_MODE }}
          RETENTION_LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.limit || vars.XZRECRUITER_RETENTION_LIMIT }}
        run: |
          set -euo pipefail
          mode="${RETENTION_MODE:-dry_run}"
          if [ "$mode" = "execute" ]; then
            export XZRECRUITER_RETENTION_EXECUTE=true
          else
            export XZRECRUITER_RETENTION_EXECUTE=false
          fi
          export XZRECRUITER_RETENTION_LIMIT="${RETENTION_LIMIT:-100}"
          node scripts/retention-executor.mjs
