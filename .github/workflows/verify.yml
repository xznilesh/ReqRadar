name: XZRecruiter production verification
on:
  push:
    branches: [main, step9-production-qa-launch-readiness, step7-canonical-security-foundation, step8-automation-real-time-manager-control-v2]
  pull_request:
    branches: [main]
permissions:
  contents: read

jobs:
  source_quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run test:step1:contract
      - run: npm run test:step1:security
      - run: npm run check:step2:jd:syntax
      - run: npm run test:step2:jd:unit
      - run: npm run test:step2:jd:integration
      - run: npm run test:step2:jd:e2e
      - run: npm run test:step2:jd:security
      - run: npm run test:step2:jd:regression
      - run: npm run test:step2
      - run: npm run check:step3:execution:syntax
      - run: npm run test:step3:execution:unit
      - run: npm run test:step3:execution:integration
      - run: npm run test:step3:execution:e2e
      - run: npm run test:step3:execution:security
      - run: npm run test:step3:execution:performance
      - run: npm run test:step3:execution:responsive
      - run: npm run test:step3
      - run: npm run check:step4:candidate:syntax
      - run: npm run test:step4:candidate:unit
      - run: npm run test:step4:candidate:integration
      - run: npm run test:step4:candidate:e2e
      - run: npm run test:step4:candidate:regression
      - run: npm run test:step4:candidate:security
      - run: npm run test:step4:candidate:concurrency
      - run: npm run test:step4:candidate:performance
      - run: npm run test:step4:candidate:responsive
      - run: npm run test:step4
      - run: npm run test:step4:closeout
      - run: npm run test:step4:performance
      - run: npm run test:step4:stage-guard
      - run: npm run test:step4:public-apply
      - run: npm run test:step4:candidate360
      - run: npm run test:step4:job360
      - run: npm run test:step5
      - run: npm run test:step5:security
      - run: npm run test:step5:portals
      - run: npm run test:step5:performance
      - run: npm run test:step5:screening
      - run: npm run test:step6
      - run: npm run test:step7
      - run: npm run test:step8
      - run: npm run test:step9
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui:browser
      - run: npm run build
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/postgres
