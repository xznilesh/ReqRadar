name: XZRecruiter production readiness monitor
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Production readiness probe
        run: |
          node --input-type=module -e '
            const endpoint="https://xzrecruiter.vercel.app/api/health/ready";
            const started=Date.now();
            const controller=new AbortController();
            const timeout=setTimeout(()=>controller.abort(),15000);
            try{
              const response=await fetch(endpoint,{cache:"no-store",headers:{accept:"application/json"},signal:controller.signal});
              const body=await response.json().catch(()=>null);
              console.log(JSON.stringify({endpoint,status:response.status,elapsed_ms:Date.now()-started,body}));
              if(response.status!==200||body?.ok!==true||body?.database!=="ready")process.exit(2);
              if(body?.dependencies){
                const bad=Object.entries(body.dependencies).filter(([,state])=>state!=="ready");
                if(bad.length){console.error("DEPENDENCY_NOT_READY",JSON.stringify(bad));process.exit(2);}
              }
            }finally{clearTimeout(timeout)}
          '
