name: XZRecruiter production deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xzrecruiter-production
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: team_bT56lx8ghZNKQb0mhkZ2T5tt
  VERCEL_PROJECT_ID: prj_VtHZ6iRBJ7mqG3malUibM34euUsf
  VERCEL_CLI_VERSION: ${{ vars.VERCEL_CLI_VERSION }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Deterministic install
        run: npm ci --no-audit --no-fund

      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx > sbom.cdx.json

      - name: Source QA and dependency gate
        run: |
          npm run test:step9
          npm audit --omit=dev --audit-level=high

      - name: Source enterprise release preflight
        run: npm run test:step9:release-source

      - name: Install browser and PostgreSQL client
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Existing browser regression suite
        run: npm run test:ui:browser

      - name: Production-like PostgreSQL load certification
        run: npm run test:step9:load-live
        env:
          XZRECRUITER_PERF_DATABASE_URL: ${{ secrets.XZRECRUITER_PERF_DATABASE_URL }}
          XZRECRUITER_DATABASE_URL: ${{ secrets.XZRECRUITER_DATABASE_URL }}
          XZRECRUITER_PERF_SIZES: 1000,10000,50000,100000
          XZRECRUITER_PERF_REPETITIONS: 100
          XZRECRUITER_PERF_P95_MS: ${{ vars.XZRECRUITER_PERF_P95_MS }}
          XZRECRUITER_PERF_P99_MS: ${{ vars.XZRECRUITER_PERF_P99_MS }}

      - name: Install pinned Vercel CLI
        run: npm install --global "vercel@${VERCEL_CLI_VERSION:?configure VERCEL_CLI_VERSION as a reviewed exact version}"

      - name: Link Vercel project
        run: |
          mkdir -p .vercel
          printf '%s\n' '{"orgId":"team_bT56lx8ghZNKQb0mhkZ2T5tt","projectId":"prj_VtHZ6iRBJ7mqG3malUibM34euUsf"}' > .vercel/project.json

      - name: Pull production configuration
        run: vercel pull --yes --environment=production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build exact production artifact
        run: vercel build --prod
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Stage production artifact without domain assignment
        id: stage
        run: |
          set -euo pipefail
          deployment_url="$(vercel deploy --prebuilt --prod --skip-domain)"
          DEPLOYMENT_URL="$deployment_url" node --input-type=module -e '
            const value=process.env.DEPLOYMENT_URL;
            const url=new URL(value);
            if(url.protocol!=="https:"||url.origin!==value||!url.hostname.endsWith(".vercel.app"))process.exit(1);
          '
          printf 'url=%s\n' "$deployment_url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Staged readiness smoke
        run: |
          STAGED_URL="$STAGED_URL" node --input-type=module -e '
            const base=process.env.STAGED_URL;
            const bypass=process.env.VERCEL_AUTOMATION_BYPASS_SECRET;
            const r=await fetch(base+"/api/health/ready",{cache:"no-store",headers:bypass?{"x-vercel-protection-bypass":bypass}:undefined});
            const body=await r.json().catch(()=>null);
            console.log(r.status,body);
            if(r.status!==200||body?.ok!==true||body?.database!=="ready")process.exit(1);
          '
        env:
          STAGED_URL: ${{ steps.stage.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Enterprise browser golden path on exact staged build
        run: npm run test:step9:browser-live
        env:
          XZRECRUITER_E2E_BASE_URL: ${{ steps.stage.outputs.url }}
          XZRECRUITER_E2E_EMAIL: ${{ secrets.XZRECRUITER_E2E_EMAIL }}
          XZRECRUITER_E2E_PASSWORD: ${{ secrets.XZRECRUITER_E2E_PASSWORD }}
          XZRECRUITER_E2E_JOB_ID: ${{ vars.XZRECRUITER_E2E_JOB_ID }}
          XZRECRUITER_E2E_APPLICATION_ID: ${{ vars.XZRECRUITER_E2E_APPLICATION_ID }}
          XZRECRUITER_E2E_CANDIDATE_NAME: ${{ vars.XZRECRUITER_E2E_CANDIDATE_NAME }}
          XZRECRUITER_E2E_JOB_TITLE: ${{ vars.XZRECRUITER_E2E_JOB_TITLE }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Live dual-tenant isolation on exact staged build
        run: npm run test:step9:tenant-isolation-live
        env:
          XZRECRUITER_E2E_BASE_URL: ${{ steps.stage.outputs.url }}
          XZRECRUITER_TENANT_A_EMAIL: ${{ secrets.XZRECRUITER_TENANT_A_EMAIL }}
          XZRECRUITER_TENANT_A_PASSWORD: ${{ secrets.XZRECRUITER_TENANT_A_PASSWORD }}
          XZRECRUITER_TENANT_A_CANDIDATE_ID: ${{ vars.XZRECRUITER_TENANT_A_CANDIDATE_ID }}
          XZRECRUITER_TENANT_A_DOCUMENT_ID: ${{ vars.XZRECRUITER_TENANT_A_DOCUMENT_ID }}
          XZRECRUITER_TENANT_B_EMAIL: ${{ secrets.XZRECRUITER_TENANT_B_EMAIL }}
          XZRECRUITER_TENANT_B_PASSWORD: ${{ secrets.XZRECRUITER_TENANT_B_PASSWORD }}
          XZRECRUITER_TENANT_B_CANDIDATE_ID: ${{ vars.XZRECRUITER_TENANT_B_CANDIDATE_ID }}
          XZRECRUITER_TENANT_B_DOCUMENT_ID: ${{ vars.XZRECRUITER_TENANT_B_DOCUMENT_ID }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Hard enterprise release gate
        run: npm run test:step9:release
        env:
          XZRECRUITER_RELEASE_BASE_URL: ${{ steps.stage.outputs.url }}
          XZRECRUITER_DATABASE_URL: ${{ secrets.XZRECRUITER_DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          XZRECRUITER_MALWARE_SCAN_URL: ${{ secrets.XZRECRUITER_MALWARE_SCAN_URL }}
          XZRECRUITER_BACKUP_RESTORE_EVIDENCE: ${{ vars.XZRECRUITER_BACKUP_RESTORE_EVIDENCE }}
          XZRECRUITER_BROWSER_E2E_EVIDENCE: github-actions:${{ github.run_id }}:enterprise-browser-e2e
          XZRECRUITER_LOAD_TEST_EVIDENCE: github-actions:${{ github.run_id }}:postgres-load
          XZRECRUITER_TENANT_ISOLATION_EVIDENCE: github-actions:${{ github.run_id }}:dual-tenant-live
          XZRECRUITER_ENTERPRISE_AUTH_EVIDENCE: ${{ vars.XZRECRUITER_ENTERPRISE_AUTH_EVIDENCE }}
          XZRECRUITER_PRIVACY_COMPLIANCE_EVIDENCE: ${{ vars.XZRECRUITER_PRIVACY_COMPLIANCE_EVIDENCE }}
          XZRECRUITER_INTEGRATIONS_EVIDENCE: ${{ vars.XZRECRUITER_INTEGRATIONS_EVIDENCE }}
          XZRECRUITER_JOB_BOARD_EVIDENCE: ${{ vars.XZRECRUITER_JOB_BOARD_EVIDENCE }}
          XZRECRUITER_OBSERVABILITY_EVIDENCE: ${{ vars.XZRECRUITER_OBSERVABILITY_EVIDENCE }}
          XZRECRUITER_PILOT_EVIDENCE: ${{ vars.XZRECRUITER_PILOT_EVIDENCE }}

      - name: Promote exact certified deployment
        run: vercel promote "$STAGED_URL"
        env:
          STAGED_URL: ${{ steps.stage.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Canonical production readiness smoke
        run: |
          node --input-type=module -e '
            const r=await fetch("https://xzrecruiter.vercel.app/api/health/ready",{cache:"no-store"});
            const body=await r.json().catch(()=>null);
            console.log(r.status,body);
            if(r.status!==200||body?.ok!==true||body?.database!=="ready")process.exit(1);
          '

      - name: Upload certification artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-certification-${{ github.run_id }}
          path: |
            sbom.cdx.json
            test-results/**
          if-no-files-found: warn
